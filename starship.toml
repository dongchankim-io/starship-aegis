# ==============================================================================
# PROMPT CURSOR
# ==============================================================================

[character]
success_symbol = "[❯](bold fg:ok)"
error_symbol = "[❯](bold fg:danger)"
vimcmd_symbol = "[❮](bold fg:dir)"
vimcmd_replace_one_symbol = "[❮](bold fg:git)"
vimcmd_replace_symbol = "[❮](bold fg:git)"
vimcmd_visual_symbol = "[❮](bold fg:warn)"

# ==============================================================================
# IDENTITY MICRO-BADGE (OS + USER + HOST + SSH IP)
# ==============================================================================

[os]
disabled = false
style = "fg:text bg:surface"
format = "[$symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Ubuntu = "󰕈"
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
CentOS = ""
RockyLinux = ""
AlmaLinux = ""
Amazon = ""
Alpine = ""
Arch = "󰣇"
Fedora = "󰣛"
SUSE = ""
Windows = "󰍲"
FreeBSD = ""

[username]
show_always = true
style_user = "bold fg:user bg:surface"
style_root = "bold fg:crust bg:danger"
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = " 󰣀"
trim_at = "."
style = "bold fg:host bg:surface"
format = "[$hostname$ssh_symbol]($style)"

[localip]
ssh_only = true
style = "fg:subtext bg:surface"
format = "[ · $localipv4]($style)"
disabled = false

# ==============================================================================
# SESSION SAFETY & MULTIPLEXER BADGES (PROD, TMUX, SSH-AGENT, SHLVL, SUDO)
# ==============================================================================

[custom.prod_alert]
when = '''case "$HOSTNAME" in *prod*|*prd*|*live*) exit 0;; *) exit 1;; esac'''
symbol = "🚨 PROD"
style = "bold fg:crust bg:danger"
format = "[](fg:danger)[$symbol]($style)[](fg:danger) "

[env_var.TMUX_PANE]
symbol = " tmux"
style = "bold fg:ok bg:surface"
format = "[](fg:surface)[$symbol]($style)[](fg:surface) "

[env_var.SSH_AUTH_SOCK]
variable = "SSH_TTY"
symbol = "󰌆"
style = "bold fg:warn"
format = "[$symbol ]($style)"
disabled = true

[shlvl]
disabled = false
threshold = 2
symbol = "↕"
style = "bold fg:git"
format = "[$symbol$shlvl]($style) "

[sudo]
disabled = false
symbol = "󰌆 "
style = "bold fg:danger"
format = "[$symbol]($style)"

[container]
symbol = "⬢"
style = "bold fg:crust bg:git"
format = "[](fg:git)[$symbol $name]($style)[](fg:git) "

[nix_shell]
symbol = "❄️ "
style = "bold fg:dir"
format = '[$symbol$state(\($name\))]($style) '

[direnv]
disabled = false
symbol = "📂 "
style = "fg:warn"
format = "[$symbol$loaded/$allowed]($style) "

# ==============================================================================
# DIRECTORY (REPO-ROOT AWARE)
# ==============================================================================

[directory]
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
style = "bold fg:dir"
repo_root_style = "bold underline fg:dir_root"
before_repo_root_style = "fg:muted"
read_only = " 󰌾"
read_only_style = "fg:danger"
format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# ==============================================================================
# GIT TELEMETRY (BRANCH, DETACHED TAGS, REBASE PILL, COUNTS, DIFF GAUGE)
# ==============================================================================

[git_branch]
symbol = " "
style = "bold fg:git"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
commit_hash_length = 7
only_detached = true
tag_disabled = false
tag_symbol = " 🏷 "
style = "bold fg:ok"
format = '[\($hash$tag\)]($style) '

[git_state]
style = "bold fg:crust bg:warn"
format = '[](fg:warn)[$state( $progress_current/$progress_total)]($style)[](fg:warn) '

[git_status]
style = "bold fg:warn"
conflicted = "⚡${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
format = '([\[$all_status$ahead_behind\]]($style) )'

[git_metrics]
disabled = false
added_style = "bold fg:ok"
deleted_style = "bold fg:danger"
only_nonzero_diffs = true
format = '([+$added]($added_style)/[-$deleted]($deleted_style) )'

# ==============================================================================
# POLYGLOT RUNTIMES
# ==============================================================================

[python]
symbol = " "
style = "bold fg:warn"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "bold fg:ok"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[bun]
symbol = " "
style = "bold fg:infra"
format = "[$symbol($version )]($style)"

[deno]
symbol = "🦕 "
style = "bold fg:ok"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold fg:infra"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold fg:dir"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "fg:infra"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "bold fg:user"
format = "[$symbol($version(-$name) )]($style)"

[zig]
symbol = "⚡ "
style = "bold fg:warn"
format = "[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "fg:subtext"
display_private = true
format = "[$symbol$version]($style) "

# ==============================================================================
# CLOUD & INFRASTRUCTURE
# ==============================================================================

[docker_context]
symbol = " "
style = "bold fg:user"
only_with_files = true
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold fg:user"
detect_files = ["k8s", "Dockerfile", "helmfile.yaml", "Chart.yaml", "skaffold.yaml", "kustomization.yaml"]
detect_folders = ["k8s", "helm", "charts", "manifests"]
format = '[$symbol$context( \($namespace\))]($style) '

[terraform]
symbol = "󱁢 "
style = "bold fg:git"
format = "[$symbol$workspace]($style) "

[aws]
symbol = " "
style = "bold fg:infra"
format = '[$symbol($profile )(\($region\) )]($style)'

[gcloud]
disabled = true

# ==============================================================================
# DIAGNOSTICS & RIGHT-PROMPT TELEMETRY PILLS
# ==============================================================================

[jobs]
symbol = "✦"
style = "bold fg:user"
number_threshold = 1
format = "[$symbol$number ]($style)"

[status]
disabled = false
symbol = "✘ "
not_executable_symbol = "🚫 "
not_found_symbol = "🔍 "
sigint_symbol = "🧱 "
signal_symbol = "⚡ "
style = "bold fg:crust bg:danger"
map_symbol = true
recognize_signal_code = true
format = '[](fg:danger)[$symbol$common_meaning$signal_name$maybe_int]($style)[](fg:danger) '

[cmd_duration]
min_time = 500
show_milliseconds = true
style = "bold fg:warn bg:surface"
format = "[](fg:surface)[⏱ $duration]($style)[](fg:surface) "

[memory_usage]
disabled = false
threshold = 80
symbol = "󰍛 "
style = "bold fg:crust bg:danger"
format = "[](fg:danger)[$symbol${ram}]($style)[](fg:danger) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:subtext bg:surface"
format = "[](fg:surface)[ $time]($style)[](fg:surface)"
