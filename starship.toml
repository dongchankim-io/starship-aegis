"$schema" = 'https://starship.rs/config-schema.json'

# ==============================================================================
# 🛰️ STARSHIP-AEGIS — Multi-Server & Polyglot Telemetry Cockpit for Starship
# Author:  Dongchan Kim (@dongchankim-io)
# Repo:    https://github.com/dongchankim-io/starship-aegis
# License: MIT
#
# Switch palette anytime:
#   "catppuccin_mocha" | "tokyo_night" | "kanagawa" | "rose_pine" | "gruvbox_material" | "nord"
# ==============================================================================
palette = "catppuccin_mocha"

command_timeout = 1000
scan_timeout = 30
add_newline = true

# Seamless box alignment when typing multi-line commands (\, loops, heredocs)
continuation_prompt = "[├─▸ ](fg:muted)"

# Left prompt: Rounded Micro-Badge Identity + High-Signal Typography
format = """
[╭─ ](fg:muted)\
[](fg:surface)\
$os\
$username\
[@](fg:muted bg:surface)\
$hostname\
$localip\
[](fg:surface) \
${custom.prod_alert}\
$env_var\
$shlvl\
$container\
$nix_shell\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$python\
$nodejs\
$bun\
$deno\
$rust\
$golang\
$java\
$c\
$zig\
$package\
$docker_context\
$kubernetes\
$terraform\
$aws\
$gcloud\
$direnv\
$line_break\
[╰─ ](fg:muted)\
$jobs\
$status\
$sudo\
$character"""

# Right prompt: Micro-pill telemetry (Duration, RAM pressure, Clock)
right_format = """$cmd_duration$memory_usage$time"""

# ==============================================================================
