text      = "#e0def4"
user      = "#9ccfd8" # Foam
host      = "#f6c177" # Gold
dir       = "#31748f" # Pine
dir_root  = "#9ccfd8" # Foam
git       = "#c4a7e7" # Iris
ok        = "#9ccfd8" # Foam
